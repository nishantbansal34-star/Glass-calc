name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.PLAY_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk NRRL-Calc-${{ github.run_number }}.apk
      - name: Upload key
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.PLAY_KEYSTORE_B64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "PLAY_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build Play bundle
        env:
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
        run: gradle -Pplay :app:bundleRelease --no-daemon --stacktrace
      - name: Name bundle
        run: cp app/build/outputs/bundle/release/app-release.aab GlassCalc-play-${{ github.run_number }}${{ env.HAS_KEY == 'true' && '' || '-UNSIGNED' }}.aab
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NRRL Calc build ${{ github.run_number }}
          body: Tap the .apk file below to download, then open it to install.
          files: |
            NRRL-Calc-*.apk
            GlassCalc-play-*.aab
          make_latest: true

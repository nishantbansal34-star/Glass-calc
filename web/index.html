<title>NRRL Glass Calc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap">
<style>
/* One deliberate look: black glass with NRRL gold. */
:root{
  color-scheme:dark;
  --bg:#000000;
  --ink:#F5F5F7;
  --ink-2:rgba(245,245,247,.58);
  --ink-3:rgba(245,245,247,.34);
  --glass:rgba(255,255,255,.045);
  --glass-hi:rgba(255,255,255,.115);
  --edge:rgba(255,255,255,.30);
  --edge-soft:rgba(255,255,255,.10);
  --edge-low:rgba(0,0,0,.6);
  --shadow:rgba(0,0,0,.8);
  --gold:#E4B95C;
  --gold-a:#F7DC8E;
  --gold-b:#C38B2A;
  --gold-ink:#1A1204;
  --good:#4FD1A5;
  --bad:#FF7A8A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* faint gold ambience so the glass has something to bend */
.backdrop{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;background:var(--bg)}
.glow{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform}
.g1{width:70vmax;height:70vmax;left:-30vmax;top:-30vmax;background:radial-gradient(circle,rgba(228,185,92,.13),transparent 62%);animation:drift1 28s ease-in-out infinite alternate}
.g2{width:60vmax;height:60vmax;right:-30vmax;bottom:-22vmax;background:radial-gradient(circle,rgba(195,139,42,.14),transparent 62%);animation:drift2 34s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(14vmax,12vmax)}}
@keyframes drift2{to{transform:translate(-12vmax,-14vmax)}}
@media (prefers-reduced-motion: reduce){.glow{animation:none}.caret{animation:none!important}}

/* glass material */
.glass{
  position:relative;isolation:isolate;
  background:linear-gradient(155deg,var(--glass-hi),var(--glass) 60%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--edge-soft);
  box-shadow:
    inset 0 1px 0 var(--edge),
    inset 0 -1px 1px var(--edge-low),
    0 12px 30px -14px var(--shadow);
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%,rgba(255,255,255,.12),transparent 55%);
}

/* shell */
.app{
  position:relative;z-index:1;height:100%;
  max-width:460px;margin:0 auto;
  padding-inline:16px;padding-block:12px 14px;
  display:flex;flex-direction:column;gap:12px;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:"Sora",sans-serif;font-weight:600;font-size:17px;letter-spacing:.06em;color:var(--gold)}
.brand span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.top-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* display */
.screen-wrap{flex:1 1 auto;min-height:170px;border-radius:30px;overflow:hidden;display:flex;flex-direction:column}
.wm{
  position:absolute;left:50%;top:31%;width:74%;max-width:320px;
  transform:translate(-50%,-50%);opacity:.17;pointer-events:none;user-select:none;z-index:0;
  transition:opacity .4s;
}
.app.tool-mode .wm{opacity:.08}
.screen{
  position:relative;z-index:1;flex:1;padding:16px 18px;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;touch-action:pan-y;
}
.calc-view{margin-top:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;width:100%}
.sub{font-family:"Sora",sans-serif;font-size:18px;color:var(--ink-2);font-variant-numeric:tabular-nums;word-break:break-all;min-height:24px;border-radius:10px;padding:0 4px}
.sub.editable{cursor:pointer}
.sub.editable:hover{background:var(--glass)}
.main{font-family:"Sora",sans-serif;font-weight:300;font-size:52px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;word-break:break-all;max-width:100%;cursor:text;user-select:none;-webkit-user-select:none}
.main.m2{font-size:40px}.main.m3{font-size:31px}.main.m4{font-size:25px}
.op{color:var(--gold);font-weight:400;padding-inline:2px}
.cm{opacity:.9}
.caret{
  display:inline-block;width:2px;height:.92em;margin-inline:-1px;vertical-align:-.1em;
  background:var(--gold);border-radius:2px;box-shadow:0 0 8px rgba(228,185,92,.7);
  animation:blink 1.05s steps(1) infinite;
}
.scrubbing .caret{animation:none}
@keyframes blink{50%{opacity:0}}
.words{font-size:12.5px;color:var(--ink-2);line-height:1.4;max-width:34ch;min-height:17px}
.hint-line{font-size:11px;color:var(--ink-3);letter-spacing:.02em}

/* tool views */
.tool{display:flex;flex-direction:column;gap:8px}
.row-opts{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:flex;padding:3px;border-radius:14px;gap:2px;background:var(--glass);border:1px solid var(--edge-soft)}
.seg button{padding:5px 9px;border-radius:11px;font-size:12px;font-weight:500;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--glass-hi);color:var(--ink);box-shadow:inset 0 1px 0 var(--edge)}
.fields{display:flex;flex-direction:column;gap:6px}
.field{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:7px 12px;border-radius:16px;text-align:left;width:100%;
  border:1px solid transparent;transition:background .2s,border-color .2s;
}
.field .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.field .val{font-family:"Sora",sans-serif;font-size:22px;font-weight:400;font-variant-numeric:tabular-nums;text-align:right;word-break:break-all;user-select:none;-webkit-user-select:none}
.field .val small{font-size:13px;color:var(--ink-2);margin-left:3px}
.field .val .ev{display:block;font-size:12px;color:var(--ink-2)}
.field.active{background:var(--glass-hi);border-color:rgba(228,185,92,.35);box-shadow:inset 0 1px 0 var(--edge)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .hint{font-size:11.5px;color:var(--ink-3);margin-right:2px}
.chip{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid var(--edge-soft);background:var(--glass);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.chip:active{transform:scale(.92)}
.chip.on{background:linear-gradient(155deg,var(--gold-a),var(--gold-b));color:var(--gold-ink);border-color:transparent}
.results{border-radius:20px;padding:8px 14px;display:flex;flex-direction:column;gap:2px;background:rgba(0,0,0,.35);border:1px solid var(--edge-soft)}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:2px 0;font-variant-numeric:tabular-nums}
.r span{font-size:13px;color:var(--ink-2)}
.r b{font-family:"Sora",sans-serif;font-weight:500;font-size:16px;text-align:right}
.r.big{border-top:1px solid var(--edge-soft);margin-top:4px;padding-top:8px}
.r.big span{color:var(--ink);font-weight:600}
.r.big b{font-size:24px;font-weight:600;color:var(--gold)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.r.big b.pos{color:var(--good)}.r.big b.neg{color:var(--bad)}
.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tgt{border-radius:14px;padding:7px 8px;text-align:center;background:var(--glass);border:1px solid var(--edge-soft)}
.tgt span{display:block;font-size:11px;color:var(--ink-2);letter-spacing:.04em}
.tgt b{font-family:"Sora",sans-serif;font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}

/* cursor arrows + mode tabs */
.navrow{display:block}
.toolbar{position:relative;z-index:1;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:2px 12px 10px}
.tb-gap{flex:1}
.tbtn{width:44px;height:36px;border-radius:12px;display:grid;place-items:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s}
.tbtn:hover{background:var(--glass)}
.tbtn:active,.tbtn.pressed{transform:scale(.86);transition-duration:.08s}
.tbtn svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tbtn.bk{width:54px}
.tbtn.bk svg{width:30px;height:22px}
.tbtn.bk .bk-body{fill:var(--gold);stroke:none}
.tbtn.bk .bk-x{stroke:var(--gold-ink);stroke-width:2.4}
.arrow{border-radius:18px;display:grid;place-items:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.arrow:active,.arrow.pressed{transform:scale(.88);transition-duration:.08s}
.arrow svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);border-radius:18px;padding:4px}
.thumb{
  position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:14px;
  transform:translateX(calc(var(--i,0) * 100%));
  transition:transform .5s cubic-bezier(.34,1.4,.64,1);
  background:linear-gradient(155deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
  border:1px solid rgba(228,185,92,.35);
  box-shadow:inset 0 1px 0 var(--edge),0 6px 16px -8px var(--shadow);
}
.tab{position:relative;z-index:1;padding:9px 0;font-size:12.5px;white-space:nowrap;font-weight:600;color:var(--ink-2);transition:color .25s}
.tab[aria-selected="true"]{color:var(--gold)}

/* keypad */
.pad{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(50px,8.2vh,70px);gap:10px}
.key{
  border-radius:24px;font-family:"Sora",sans-serif;font-size:26px;font-weight:400;
  display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:transform .42s cubic-bezier(.34,1.56,.64,1),background .2s;
}
.key.pressed,.key:active{transform:scale(.92);transition-duration:.08s}
.key.fn{font-size:19px;font-weight:500;color:var(--ink-2)}
.key.op{color:var(--gold);font-size:30px}
.key.br{font-size:24px;letter-spacing:.06em}
.key svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.key.eq{
  color:var(--gold-ink);font-size:32px;font-weight:500;
  background:linear-gradient(155deg,var(--gold-a),var(--gold) 45%,var(--gold-b));
  border-color:rgba(255,236,190,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 4px rgba(90,60,10,.35),0 10px 26px -12px rgba(228,185,92,.55);
}
.app.tool-mode .pad{grid-auto-rows:clamp(40px,5.7vh,54px);gap:8px}
.app.tool-mode .toolbar{padding:0 10px 6px}
.app.tool-mode .tbtn{height:30px}
.app.tool-mode .row-opts{flex-wrap:nowrap}
.app.tool-mode .seg button{padding:5px 8px;font-size:11.5px;white-space:nowrap}
.app.tool-mode .field{padding:5px 12px}
.app.tool-mode .fields{gap:4px}
.app.tool-mode .key{border-radius:20px;font-size:22px}
.app.tool-mode .key.op{font-size:25px}.app.tool-mode .key.eq{font-size:27px}
.app.tool-mode .screen{padding:12px 12px 4px}

/* history + toast */
.scrim{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding-inline:12px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:440px;max-height:72%;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(155deg,rgba(40,36,28,.85),rgba(12,12,12,.92))}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{margin:0;font-family:"Sora",sans-serif;font-weight:500;font-size:18px;color:var(--gold)}
.sheet-head .acts{display:flex;gap:8px}
.txt-btn{padding:7px 12px;border-radius:12px;font-size:13px;font-weight:600;border:1px solid var(--edge-soft);background:var(--glass)}
.txt-btn.danger{color:var(--bad)}
.hist{overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.h-item{text-align:right;padding:9px 12px;border-radius:14px;width:100%}
.h-item:hover{background:var(--glass)}
.h-item small{display:block;font-size:13px;color:var(--ink-2);word-break:break-all}
.h-item b{font-family:"Sora",sans-serif;font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.empty{color:var(--ink-2);font-size:14px;text-align:center;padding:24px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:9;padding:10px 16px;border-radius:16px;font-size:14px;font-weight:600;transition:opacity .25s,transform .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-height:680px){
  .main{font-size:42px}.main.m2{font-size:33px}.main.m3{font-size:26px}.main.m4{font-size:21px}
  .pad{gap:8px}
  .field .val{font-size:19px}
}
</style>

<div class="backdrop" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div></div>

<main class="app" id="app">

    <div class="brand"><b>NRRL</b><span>Glass Calc</span></div>

      <button class="icon-btn glass" id="copyBtn" aria-label="Copy result">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M15 9V7a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v5a3 3 0 0 0 3 3h2"/></svg>
      </button>
      <button class="icon-btn glass" id="histBtn" aria-label="History">
        <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v4.5h4.5"/><path d="M12 7.5V12l3 2"/></svg>
      </button>

<script>
(function(){
const OPS = "+−×÷";
const MODES = ["calc","gst","margin","discount"];
const FIELDS = {
  gst:[["amount","Amount","₹"],["rate","GST rate","%"]],
  margin:[["cost","Cost price","₹"],["sell","Selling price","₹"],["qty","Quantity","pcs"]],
  discount:[["mrp","MRP","₹"],["disc","Discount","%"],["qty","Quantity","pcs"]]
};
const DEFAULT = {
  mode:"calc", expr:"1250×24+18%", cur:null, prev:"", done:false, hist:[],
  gst:{amount:"2360", rate:"18", dir:"remove", split:"intra"},
  margin:{cost:"82", sell:"120", qty:"250"},
  discount:{mrp:"499", disc:"20", qty:"12"},
  active:{gst:"amount", margin:"cost", discount:"mrp"}
};
let S;
try{ S = Object.assign(structuredClone(DEFAULT), JSON.parse(localStorage.getItem("nrrl-glass-calc")||"null")||{}); }
catch(e){ S = structuredClone(DEFAULT); }
let fresh = true;        // next digit replaces the active field's value
let fieldCur = null;     // cursor inside the active field (null = end)
function save(){ try{ localStorage.setItem("nrrl-glass-calc", JSON.stringify(S)); }catch(e){} }

/* ---------- number helpers ---------- */
function groupIN(i){
  const neg = i.startsWith("-"); if(neg) i = i.slice(1);
  if(i.length>3){ const last = i.slice(-3), rest = i.slice(0,-3); i = rest.replace(/\B(?=(\d{2})+(?!\d))/g,",")+","+last; }
  return (neg?"-":"")+i;
}
function clean(v){ return Math.round(v*1e10)/1e10; }
function fmt(v, dec){
  if(v==null || !isFinite(v)) return "—";
  if(Math.abs(v)>=1e15) return v.toExponential(6);
  v = clean(v);
  let s = dec==null ? String(v) : v.toFixed(dec);
  if(s.includes("e")) s = v.toFixed(10).replace(/\.?0+$/,"");
  const [i,d] = s.split(".");
  return groupIN(i) + (d ? "."+d : "");
}
const money = v => (v<0?"−₹":"₹") + fmt(Math.abs(v),2);
const pct = v => isFinite(v) ? fmt(Math.round(v*100)/100)+"%" : "—";
const toExpr = v => String(v).replace("-","−");

/* expression -> HTML with Indian commas, gold operators and an optional caret */
function exprHTML(s, cur){
  const n = s.length, comma = new Array(n).fill(false);
  s.replace(/[\d.]+/g, (run, a) => {
    const dot = run.indexOf("."), L = dot<0 ? run.length : dot;
    for(let j=1;j<L;j++){ const r = L-j; if(r===3 || (r>3 && (r-3)%2===0)) comma[a+j] = true; }
    return run;
  });
  const caret = '<span class="caret"></span>';
  let out = "";
  for(let i=0;i<n;i++){
    if(comma[i]) out += '<span class="cm">,</span>';
    if(cur===i) out += caret;
    const c = s[i];
    out += `<span class="ch${OPS.includes(c)||c==="("||c===")"?" op":""}" data-i="${i}">${c}</span>`;
  }
  if(cur!=null && cur>=n) out += caret;
  return out;
}

/* ---------- evaluator: + − × ÷ and shop-style % ---------- */
function evaluate(src){
  if(src==null) return null;
  let s = String(src), prevS;
  do{ prevS = s; s = s.replace(/[+−×÷(]+$/,""); }while(s!==prevS);   // ignore unfinished tail
  if(!s) return null;
  const open = (s.match(/\(/g)||[]).length - (s.match(/\)/g)||[]).length;
  if(open<0) return null;
  s += ")".repeat(open);                                            // auto-close brackets
  const toks = s.match(/\d*\.?\d+|\d+\.|[+−×÷%()]/g);
  if(!toks || toks.join("")!==s) return null;
  let p = 0;
  const peek = () => toks[p];
  function factor(){
    let sign = 1;
    while(peek()==="−"){ sign = -sign; p++; }
    let n;
    if(peek()==="("){
      p++; n = sign*expr();
      if(toks[p++]!==")") throw 0;
    }else{
      const t = toks[p++];
      if(t==null || isNaN(parseFloat(t))) throw 0;
      n = sign*parseFloat(t);
    }
    let isPct = false;
    if(peek()==="%"){ p++; isPct = true; }
    return {n,isPct};
  }
  function term(){
    const f = factor();
    let v = f.isPct ? f.n/100 : f.n, only = true;
    while(peek()==="×" || peek()==="÷"){
      const op = toks[p++]; only = false;
      const g = factor(); const gv = g.isPct ? g.n/100 : g.n;
      if(op==="×") v *= gv; else { if(gv===0) throw 0; v /= gv; }
    }
    return {v, pctOnly: only && f.isPct, raw: f.n};
  }
  function expr(){
    let acc = term().v;
    while(peek()==="+" || peek()==="−"){
      const op = toks[p++]; const t = term();
      const val = t.pctOnly ? acc*t.raw/100 : t.v;   // 200 + 18% = 236
      acc = op==="+" ? acc+val : acc-val;
    }
    return acc;
  }
  try{
    const acc = expr();
    if(p!==toks.length) return null;
    return isFinite(acc) ? clean(acc) : null;
  }catch(e){ return null; }
}
const num = (m,k) => { const v = evaluate(S[m][k]); return v==null ? 0 : v; };

/* ---------- amount in words (Indian system) ---------- */
const ONES = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
const two = n => n<20 ? ONES[n] : TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"");
const three = n => { const h=Math.floor(n/100), r=n%100; return (h?ONES[h]+" Hundred"+(r?" ":""):"")+(r?two(r):""); };
function inWords(v){
  if(v==null || !isFinite(v) || v<0) return "";
  let n = Math.floor(v); const paise = Math.round((v-n)*100);
  if(n>=1e10) return "";
  const parts = [];
  const cr = Math.floor(n/1e7); n%=1e7;
  const lk = Math.floor(n/1e5); n%=1e5;
  const th = Math.floor(n/1e3); n%=1e3;
  if(cr) parts.push(three(cr)+" Crore");
  if(lk) parts.push(two(lk)+" Lakh");
  if(th) parts.push(two(th)+" Thousand");
  if(n) parts.push(three(n));
  let out = "Rupees "+(parts.join(" ")||"Zero");
  if(paise) out += " and "+two(paise)+" Paise";
  return out+" Only";
}

/* ---------- cursor target (calc expression or active field) ---------- */
function getTarget(){
  if(S.mode==="calc"){
    const s = S.expr; return {s, c: S.cur==null ? s.length : Math.min(S.cur, s.length)};
  }
  const s = S[S.mode][S.active[S.mode]];
  return {s, c: fieldCur==null ? s.length : Math.min(fieldCur, s.length)};
}
function setTarget(s, c){
  const cc = c>=s.length ? null : Math.max(0,c);
  if(S.mode==="calc"){ S.expr = s; S.cur = cc; }
  else { S[S.mode][S.active[S.mode]] = s; fieldCur = cc; }
}

/* ---------- rendering ---------- */
const $ = id => document.getElementById(id);
const screen = $("screen");
function sizeClass(len){ return len>22?"m4":len>16?"m3":len>11?"m2":""; }

function renderCalc(){
  const hasOp = /[+−×÷%]/.test(S.expr.replace(/^−/,""));
  const val = evaluate(S.expr);
  let main, sub, words, len;
  if(S.done){
    main = fmt(val); len = main.length;
    sub = exprHTML(S.prev, null)+" =";
    words = inWords(val);
  }else{
    const {c} = getTarget();
    main = S.expr ? exprHTML(S.expr, c) : '<span class="caret"></span><span class="ch">0</span>';
    len = fmt(0).length + S.expr.length*1.15;
    sub = hasOp && val!=null ? "= "+fmt(val) : "";
    words = inWords(val);
  }
  screen.innerHTML = `<div class="calc-view">
    <div class="sub${S.done?" editable":""}" ${S.done?'data-editprev="1" title="Tap to edit"':""}>${sub}</div>
    <div class="main ${sizeClass(len)}" data-scrub="1">${main}</div>
    <div class="words">${words}</div>
    ${S.done ? '<div class="hint-line">Tap the sum above to fix it</div>' : ""}</div>`;
}

function fieldHTML(mode,[key,label,unit]){
  const raw = S[mode][key];
  const active = S.active[mode]===key;
  const isMoney = unit==="₹";
  const hasOp = /[+−×÷%]/.test(raw.replace(/^−/,""));
  let shown;
  if(active){
    const c = fieldCur==null ? raw.length : Math.min(fieldCur, raw.length);
    shown = raw ? exprHTML(raw, c) : '<span class="caret"></span>0';
  } else shown = raw ? exprHTML(raw, null) : "0";
  if(isMoney) shown = "₹"+shown;
  const ev = hasOp ? `<span class="ev">= ${fmt(evaluate(raw))}</span>` : "";
  const u = isMoney ? "" : `<small>${unit}</small>`;
  return `<button class="field${active?" active":""}" data-field="${key}" id="f-${mode}-${key}">
    <span class="lbl">${label}</span><span class="val"${active?' data-scrub="1"':""}>${shown}${u}${ev}</span></button>`;
}
function seg(opt, items){
  return `<div class="seg" role="group">${items.map(([v,l])=>`<button data-opt="${opt}" data-v="${v}" aria-pressed="${S[S.mode][opt]===v}">${l}</button>`).join("")}</div>`;
}
function chips(field, list, hint){
  const cur = S[S.mode][field];
  return `<div class="chips"><span class="hint">${hint}</span>${list.map(v=>`<button class="chip${cur===String(v)?" on":""}" data-chip="${field}" data-v="${v}">${v}%</button>`).join("")}</div>`;
}

function renderGST(){
  const g = S.gst, A = num("gst","amount"), r = num("gst","rate");
  let base, tax, total;
  if(g.dir==="add"){ base=A; tax=A*r/100; total=A+tax; }
  else { total=A; base=A*100/(100+r); tax=total-base; }
  const half = r/2;
  const split = g.split==="intra"
    ? `<div class="r"><span>CGST @ ${fmt(half)}%</span><b>${money(tax/2)}</b></div><div class="r"><span>SGST @ ${fmt(half)}%</span><b>${money(tax/2)}</b></div>`
    : `<div class="r"><span>IGST @ ${fmt(r)}%</span><b>${money(tax)}</b></div>`;
  screen.innerHTML = `<div class="tool">
    <div class="row-opts">${seg("dir",[["add","Add GST"],["remove","Remove GST"]])}${seg("split",[["intra","Within UP"],["inter","Other state"]])}</div>
    <div class="fields">${FIELDS.gst.map(f=>fieldHTML("gst",f)).join("")}</div>
    ${chips("rate",[5,18,40],"Slab")}
    <div class="results">
      <div class="r"><span>Taxable value</span><b>${money(base)}</b></div>
      ${split}
      <div class="r big"><span>${g.dir==="add"?"Total with GST":"Total (incl. GST)"}</span><b>${money(total)}</b></div>
    </div></div>`;
}

function renderMargin(){
  const c = num("margin","cost"), s = num("margin","sell"), q = num("margin","qty");
  const p = s-c, m = s ? p/s*100 : NaN, mk = c ? p/c*100 : NaN;
  const cls = p>=0 ? "pos" : "neg";
  const tg = [25,35,50].map(t=>`<div class="tgt"><span>${t}% margin</span><b>${c?money(c/(1-t/100)):"—"}</b></div>`).join("");
  screen.innerHTML = `<div class="tool">
    <div class="fields">${FIELDS.margin.map(f=>fieldHTML("margin",f)).join("")}</div>
    <div class="results">
      <div class="r"><span>Profit per piece</span><b class="${cls}">${money(p)}</b></div>
      <div class="r"><span>Margin (on selling)</span><b class="${cls}">${pct(m)}</b></div>
      <div class="r"><span>Markup (on cost)</span><b class="${cls}">${pct(mk)}</b></div>
      <div class="r big"><span>Profit on ${fmt(q)} pcs</span><b class="${cls}">${money(p*q)}</b></div>
    </div>
    <div class="targets">${tg}</div></div>`;
}

function renderDiscount(){
  const mrp = num("discount","mrp"), d = num("discount","disc"), q = num("discount","qty");
  const price = mrp*(1-d/100), saveU = mrp-price;
  screen.innerHTML = `<div class="tool">
    <div class="fields">${FIELDS.discount.map(f=>fieldHTML("discount",f)).join("")}</div>
    ${chips("disc",[10,15,20,30,50],"Quick")}
    <div class="results">
      <div class="r"><span>Price after discount</span><b>${money(price)}</b></div>
      <div class="r"><span>Saving per piece</span><b class="pos">${money(saveU)}</b></div>
      <div class="r"><span>Customer saves on ${fmt(q)} pcs</span><b class="pos">${money(saveU*q)}</b></div>
      <div class="r big"><span>Bill for ${fmt(q)} pcs</span><b>${money(price*q)}</b></div>
    </div></div>`;
}

function render(){
  $("thumb").style.setProperty("--i", MODES.indexOf(S.mode));
  $("app").classList.toggle("tool-mode", S.mode!=="calc");
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.mode===S.mode));
  ({calc:renderCalc, gst:renderGST, margin:renderMargin, discount:renderDiscount})[S.mode]();
  save();
}

/* ---------- editing at the cursor ---------- */
const lastRun  = s => (s.match(/[\d.]*$/)||[""])[0];
const firstRun = s => (s.match(/^[\d.]*/)||[""])[0];

function insertAt(s, c, k, isField){
  let left = s.slice(0,c), right = s.slice(c);
  const last = left.slice(-1);
  if(/^\d$/.test(k)){
    if(lastRun(left)==="0" && !firstRun(right)) left = left.slice(0,-1)+k;
    else if(last==="%" || last===")") left += "×"+k;
    else left += k;
  }else if(k==="00"){
    const r = lastRun(left);
    if(!r || r==="0" || last==="%" || last===")") return {s,c};
    left += "00";
  }else if(k==="."){
    if((lastRun(left)+firstRun(right)).includes(".")) return {s,c};
    if(last==="%" || last===")") left += "×0.";
    else left += lastRun(left) ? "." : "0.";
  }else if(k==="%"){
    if(!/[\d.)]$/.test(left) || right[0]==="%") return {s,c};
    left += "%";
  }else if(OPS.includes(k)){
    if(OPS.includes(right[0])) right = right.slice(1);
    if(left===""){ if(k==="−") left = "−"; else if(isField) left = "0"+k; else return {s,c}; }
    else if(left==="−") return {s,c};
    else if(last==="("){ if(k==="−") left += k; else return {s,c}; }
    else if(OPS.includes(last)){ if(left.slice(-2,-1)==="(" ) { if(k!=="−") return {s,c}; } else left = left.slice(0,-1)+k; }
    else left += k;
  }else if(k==="()"){
    const open = (left.match(/\(/g)||[]).length - (left.match(/\)/g)||[]).length;
    const afterValue = /[\d.%)]$/.test(left);
    if(open>0 && afterValue) left += ")";
    else left += afterValue ? "×(" : "(";
  }
  return {s:left+right, c:left.length};
}

function editPrev(atEnd){
  S.expr = S.prev; S.prev = ""; S.done = false;
  S.cur = atEnd ? null : Math.max(0, S.expr.length-1);
}

function pressCalc(k){
  if(k==="C"){ S.expr=""; S.cur=null; S.prev=""; S.done=false; return; }
  if(k==="="){
    const v = evaluate(S.expr);
    if(v==null || S.done) return;
    if(/[+−×÷%]/.test(S.expr.replace(/^−/,""))){
      S.hist.unshift({e:S.expr, v}); S.hist = S.hist.slice(0,40);
    }
    S.prev = S.expr; S.expr = toExpr(v); S.cur = null; S.done = true;
    return;
  }
  if(S.done){
    S.done = false; S.prev = ""; S.cur = null;
    if(k!=="B" && !OPS.includes(k) && k!=="%" && k!=="()") S.expr = "";   // digit starts fresh; operator continues from result
  }
  const {s,c} = getTarget();
  if(k==="B"){ if(c>0) setTarget(s.slice(0,c-1)+s.slice(c), c-1); return; }
  const r = insertAt(s, c, k, false); setTarget(r.s, r.c);
}

function pressField(k){
  const m = S.mode, key = S.active[m], list = FIELDS[m];
  if(k==="C"){ S[m][key] = ""; fieldCur = null; fresh = false; return; }
  if(k==="="){
    const v = evaluate(S[m][key]); if(v!=null) S[m][key] = toExpr(v);
    const idx = list.findIndex(f=>f[0]===key);
    S.active[m] = list[(idx+1)%list.length][0]; fieldCur = null; fresh = true; return;
  }
  if(fresh && (/^\d$/.test(k) || k==="00" || k===".")){ S[m][key] = ""; fieldCur = null; }
  fresh = false;
  const {s,c} = getTarget();
  if(k==="B"){ if(c>0) setTarget(s.slice(0,c-1)+s.slice(c), c-1); return; }
  const r = insertAt(s, c, k, true); setTarget(r.s, r.c);
}

function moveCursor(d){
  if(S.mode==="calc" && S.done){ editPrev(d>0); render(); return; }
  const {s,c} = getTarget();
  fresh = false;
  setTarget(s, Math.max(0, Math.min(s.length, c+d)));
  render();
}

function buzz(){ try{ if(window.NRRL && NRRL.haptic){ NRRL.haptic(); return; } navigator.vibrate && navigator.vibrate(6); }catch(e){} }
function press(k){
  buzz();
  if(S.mode==="calc") pressCalc(k); else pressField(k);
  render();
}

/* keypad */
$("pad").addEventListener("click", e=>{ const b = e.target.closest(".key"); if(b) press(b.dataset.k); });
$("pad").addEventListener("pointerdown", e=>{
  const b = e.target.closest(".key"); if(!b) return;
  b.classList.add("pressed"); setTimeout(()=>b.classList.remove("pressed"),120);
});

/* cursor arrows, with hold-to-repeat */
function holdRepeat(btn, act, rate){
  let t1, t2;
  const stop = ()=>{ clearTimeout(t1); clearInterval(t2); btn.classList.remove("pressed"); };
  btn.addEventListener("pointerdown", e=>{
    e.preventDefault(); buzz(); btn.classList.add("pressed"); act();
    t1 = setTimeout(()=>{ t2 = setInterval(act, rate); }, 400);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>btn.addEventListener(ev, stop));
  btn.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(); } });
}
holdRepeat($("curL"), ()=>moveCursor(-1), 70);
holdRepeat($("curR"), ()=>moveCursor(1), 70);
holdRepeat($("bkBtn"), ()=>{ if(S.mode==="calc") pressCalc("B"); else pressField("B"); render(); }, 90);

$("tabs").addEventListener("click", e=>{
  const t = e.target.closest(".tab"); if(!t) return;
  S.mode = t.dataset.mode; fresh = true; fieldCur = null; render();
});

/* tap a digit to put the cursor there; drag sideways to slide it */
function indexFromPoint(e, container){
  const ch = e.target.closest(".ch");
  const {s} = getTarget();
  if(!ch || ch.dataset.i==null) return s.length;
  const r = ch.getBoundingClientRect();
  return +ch.dataset.i + (e.clientX > r.left + r.width/2 ? 1 : 0);
}
let scrub = null, swallowClick = false;
screen.addEventListener("pointerdown", e=>{
  const zone = e.target.closest("[data-scrub]");
  if(!zone || (S.mode==="calc" && S.done)) return;
  scrub = {x:e.clientX, y:e.clientY, start:getTarget().c, moved:false};
});
window.addEventListener("pointermove", e=>{
  if(!scrub) return;
  const dx = e.clientX - scrub.x, dy = e.clientY - scrub.y;
  if(!scrub.moved && Math.abs(dx) < 10) return;
  if(!scrub.moved && Math.abs(dy) > Math.abs(dx)){ scrub = null; return; }
  scrub.moved = true; screen.classList.add("scrubbing");
  const {s} = getTarget();
  const c = Math.max(0, Math.min(s.length, scrub.start + Math.round(dx/16)));
  if(c !== getTarget().c){ fresh = false; setTarget(s, c); render(); buzz(); }
});
function endScrub(){ if(scrub && scrub.moved) swallowClick = true; scrub = null; screen.classList.remove("scrubbing"); }
window.addEventListener("pointerup", endScrub);
window.addEventListener("pointercancel", endScrub);

screen.addEventListener("click", e=>{
  if(swallowClick){ swallowClick = false; return; }
  if(S.mode==="calc"){
    if(S.done && e.target.closest("[data-editprev], .main")){ editPrev(true); render(); return; }
    if(e.target.closest(".main")){ const {s} = getTarget(); setTarget(s, indexFromPoint(e)); render(); }
    return;
  }
  const f = e.target.closest("[data-field]");
  if(f){
    if(S.active[S.mode]===f.dataset.field){
      fresh = false; const {s} = getTarget(); setTarget(s, indexFromPoint(e));
    }else{
      S.active[S.mode] = f.dataset.field; fieldCur = null; fresh = true;
    }
    render(); return;
  }
  const o = e.target.closest("[data-opt]");
  if(o){ S[S.mode][o.dataset.opt] = o.dataset.v; render(); return; }
  const c = e.target.closest("[data-chip]");
  if(c){ S[S.mode][c.dataset.chip] = c.dataset.v; fieldCur = null; render(); }
});

document.addEventListener("keydown", e=>{
  if(!$("scrim").hidden){ if(e.key==="Escape") closeHist(); return; }
  if(e.target.closest && e.target.closest(".arrow")) return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); moveCursor(-1); return; }
  if(e.key==="ArrowRight"){ e.preventDefault(); moveCursor(1); return; }
  const map = {"*":"×","x":"×","/":"÷","-":"−","+":"+","Enter":"=","=":"=","Backspace":"B","Escape":"C","Delete":"C","%":"%",".":".","(":"()",")":"()"};
  const k = /^\d$/.test(e.key) ? e.key : map[e.key];
  if(!k) return;
  e.preventDefault(); press(k);
});

/* copy */
function primaryValue(){
  if(S.mode==="calc") return evaluate(S.expr);
  const node = screen.querySelector(".r.big b");
  return node ? node.textContent : null;
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"),1600);
}
$("copyBtn").addEventListener("click", ()=>{
  const v = primaryValue(); if(v==null) return;
  const text = typeof v==="number" ? String(v) : v.replace(/[₹,]/g,"").replace("−","-");
  const label = typeof v==="number" ? fmt(v) : v;
  if(window.NRRL && NRRL.copy){ try{ NRRL.copy(text); toast("Copied "+label); }catch(e){ toast(label); } return; }
  try{ navigator.clipboard.writeText(text).then(()=>toast("Copied "+label)).catch(()=>toast(label)); }
  catch(e){ toast(label); }
});

/* history */
function renderHist(){
  const h = $("hist");
  h.innerHTML = S.hist.length
    ? S.hist.map((x,i)=>`<button class="h-item" data-h="${i}"><small>${exprHTML(x.e,null)} =</small><b>${fmt(x.v)}</b></button>`).join("")
    : `<div class="empty">Sums you finish with = show up here.</div>`;
}
function closeHist(){ $("scrim").hidden = true; }
window.__nrrlBack = function(){ if(!$("scrim").hidden){ closeHist(); return true; } return false; };
$("histBtn").addEventListener("click", ()=>{ renderHist(); $("scrim").hidden = false; });
$("closeHist").addEventListener("click", closeHist);
$("scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeHist(); });
$("clearHist").addEventListener("click", ()=>{ S.hist = []; save(); renderHist(); });
$("hist").addEventListener("click", e=>{
  const b = e.target.closest("[data-h]"); if(!b) return;
  const x = S.hist[+b.dataset.h];
  S.mode = "calc"; S.prev = x.e; S.expr = toExpr(x.v); S.cur = null; S.done = true;
  closeHist(); render();
});

render();
})();
</script>
